<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D8BE8"/>
      <stop offset="0.55" stop-color="#5CC8F5"/>
      <stop offset="1" stop-color="#C9F0FF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFBCC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B6F07A"/>
      <stop offset="1" stop-color="#3FA535"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7BD957"/>
      <stop offset="1" stop-color="#1F7A2E"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6F3FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A5C99" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="900" height="300" fill="url(#sky)"/>
  <circle cx="760" cy="70" r="150" fill="url(#sun)"/>
  <rect width="900" height="150" fill="url(#gloss)"/>

  <g fill="#FFFFFF" opacity="0.75">
    <ellipse cx="160" cy="70" rx="70" ry="20"/>
    <ellipse cx="205" cy="58" rx="45" ry="18"/>
    <ellipse cx="620" cy="110" rx="60" ry="16"/>
    <ellipse cx="660" cy="100" rx="38" ry="14"/>
  </g>

  <path d="M0 250 Q160 190 340 235 T680 228 T900 205 L900 300 L0 300Z" fill="url(#hill1)"/>
  <path d="M0 275 Q200 235 420 265 T900 250 L900 300 L0 300Z" fill="url(#hill2)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.5">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="7s" repeatCount="indefinite"/>
      <circle cx="90" cy="190" r="38" fill="url(#bub)"/>
      <ellipse cx="78" cy="175" rx="11" ry="6" fill="#FFFFFF" stroke="none" opacity="0.85"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5s" repeatCount="indefinite"/>
      <circle cx="185" cy="115" r="18" fill="url(#bub)"/>
      <ellipse cx="179" cy="108" rx="5" ry="3" fill="#FFFFFF" stroke="none" opacity="0.85"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="8s" repeatCount="indefinite"/>
      <circle cx="255" cy="225" r="26" fill="url(#bub)"/>
      <ellipse cx="247" cy="215" rx="8" ry="4" fill="#FFFFFF" stroke="none" opacity="0.85"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="9s" repeatCount="indefinite"/>
      <circle cx="715" cy="95" r="44" fill="url(#bub)"/>
      <ellipse cx="700" cy="78" rx="13" ry="7" fill="#FFFFFF" stroke="none" opacity="0.85"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="805" cy="205" r="28" fill="url(#bub)"/>
      <ellipse cx="797" cy="196" rx="8" ry="4" fill="#FFFFFF" stroke="none" opacity="0.85"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
      <circle cx="850" cy="60" r="16" fill="url(#bub)"/>
      <ellipse cx="845" cy="54" rx="4" ry="2.5" fill="#FFFFFF" stroke="none" opacity="0.85"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -11;0 0" dur="7s" repeatCount="indefinite"/>
      <circle cx="625" cy="215" r="20" fill="url(#bub)"/>
      <ellipse cx="619" cy="208" rx="6" ry="3" fill="#FFFFFF" stroke="none" opacity="0.85"/></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6s" repeatCount="indefinite"/>
      <circle cx="40" cy="55" r="22" fill="url(#bub)"/>
      <ellipse cx="34" cy="48" rx="6" ry="3.5" fill="#FFFFFF" stroke="none" opacity="0.85"/></g>
  </g>

  <text x="450" y="160" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="104" font-weight="700" fill="url(#txt)" filter="url(#shadow)">ctf_-</text>
  <text x="450" y="205" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="22" fill="#FFFFFF" filter="url(#shadow)" letter-spacing="3">desenvolvedor independente</text>
</svg>
